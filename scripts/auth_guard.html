<!-- ===== OPCO PORTAL AUTH GUARD ===== -->
<style>
  /* Hide page until auth verified — prevents content flash */
  html.__opco_unauth body { visibility: hidden !important; }

  /* Default: fixed overlay (fallback if .header-meta is not found) */
  #__opco_auth_topbar {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 99999;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 14px;
    background: rgba(42,42,40,0.85);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    color: #e8e6e0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #__opco_auth_topbar.shown { display: inline-flex; }

  /* Inline mode: when relocated into .header-meta — flow with theme-toggle */
  #__opco_auth_topbar.__opco_inline {
    position: static !important;
    top: auto !important; right: auto !important;
    z-index: auto !important;
    background: transparent !important;
    border: 1px solid rgba(0,0,0,0.10) !important;
    color: inherit !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
  }
  body.dark #__opco_auth_topbar.__opco_inline {
    border-color: rgba(255,255,255,0.12) !important;
  }

  /* Internal pieces */
  #__opco_portal_back {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    color: inherit;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 11px;
    border-radius: 999px;
    transition: background 0.15s;
    white-space: nowrap;
  }
  #__opco_portal_back:hover { background: rgba(0,0,0,0.06); }
  body.dark #__opco_portal_back:hover { background: rgba(255,255,255,0.08); }

  #__opco_auth_topbar .__opco_sep {
    width: 1px; height: 16px;
    background: currentColor;
    opacity: 0.20;
    flex-shrink: 0;
  }

  /* Scope these to the topbar context only — the .opco-band on
     documents.html ALSO uses id="__opco_auth_user" / id="__opco_auth_logout",
     and we don't want our 28px circular logout style to override the
     band's 34px square .opco-band-iconbtn there. */
  #__opco_auth_topbar #__opco_auth_user {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    padding: 0 2px;
  }

  #__opco_auth_topbar #__opco_auth_logout {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: inherit;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    transition: background 0.15s, color 0.15s;
  }
  #__opco_auth_topbar #__opco_auth_logout svg { width: 14px; height: 14px; display: block; }
  #__opco_auth_topbar #__opco_auth_logout:hover {
    background: rgba(230, 57, 70, 0.14);
    color: #e63946;
  }
  body.dark #__opco_auth_topbar #__opco_auth_logout:hover {
    background: rgba(255, 90, 100, 0.18);
    color: #ff5a64;
  }
</style>

<div id="__opco_auth_topbar">
  <a id="__opco_portal_back" href="./" title="Back to portal">&larr; Portal</a>
  <span class="__opco_sep" aria-hidden="true"></span>
  <span id="__opco_auth_user">user</span>
  <button id="__opco_auth_logout" type="button" title="Sign out" aria-label="Sign out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
  </button>
</div>

<script>
(function(){
  // Hide content until verified
  document.documentElement.classList.add("__opco_unauth");

  var __OPCO_USERS = {
    "o.cavdar": "226dc1a59abcf03ccfd2e6f2dc9086a3624688fbfd0d58c39ebf74a6f5badc91",
    "r.khald": "9ee4cf6d646918849f195b51c5a515cee6b0cb336d9564261ff403b575f3f3f7",
    "a.hajhasan": "d18217901818217a5cdeabe0bdadb7cbd2d3b2541bd8aa2f79c1841283763d2f",
    "m.alahmad": "3f3242a14999ec7d15a2f5fe1426b26103d1a2d8fbe6feb8e83b3c8077518adf",
    "a.mando": "7296967f2469f120d0679b3e77b66d2db6d15ca77a8636ed2dcd4f9318afcb06",
    "m.barazi": "bb0ebe6a1e0898e317a0c1efe99883109d889f4d8e1d0a73abcb7aa10a0eaf81",
    "o.barazi": "f665e31c54aa2b161a3254d6021c2faeba9ad7323beea39c352c1d288fb4626c",
    "a.barazi": "a6e770fe55f59dbb6a88506ad0fb517e38c5d95ffff56045ea951cf833e42f56",
    "a.dlshad": "b255f24bd8c2aafc6d589f0bc687a3e1346c95d5dd1063b1421d28f3d34ad7ff",
    "y.ramadhan": "9b3e57232dbb921c0f86a064027fee1728a11e72abe5413a4b922ad3706a5a14",
    "a.taha": "b574e3dffeebecafb7466903221bb29bdb54378787491ee4f3d9730cd90b1af4",
    "e.saday": "178d7dfa70f54b8dff4ccd8df194843e46ade2189768d523cfdf4d8c7e59b5f2"
  };
  var __OPCO_SESSION_KEY = "__opco_session_v1";

  function readSession(){
    try {
      var raw = localStorage.getItem(__OPCO_SESSION_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (!s || !s.u || !s.exp) return null;
      if (Date.now() > s.exp) { localStorage.removeItem(__OPCO_SESSION_KEY); return null; }
      if (!__OPCO_USERS[s.u]) { localStorage.removeItem(__OPCO_SESSION_KEY); return null; }
      return s;
    } catch(e) { return null; }
  }

  var sess = readSession();
  if (!sess) {
    // No session — bounce to portal
    location.replace("./");
    return;
  }

  // Authorized — reveal page once DOM ready
  function reveal(){
    document.documentElement.classList.remove("__opco_unauth");
    var topbar = document.getElementById("__opco_auth_topbar");

    // The page may carry MULTIPLE elements with id="__opco_auth_user" /
    // id="__opco_auth_logout" (the topbar that we inject AND a separate
    // copy in the .opco-band on documents.html). Duplicate IDs are
    // technically invalid but browsers honor them; querySelectorAll('#x')
    // matches them all, getElementById would only catch the first. Walk
    // every match so both the topbar and the band stay in sync.
    var users   = document.querySelectorAll("#__opco_auth_user");
    var logouts = document.querySelectorAll("#__opco_auth_logout");

    // Try to relocate the topbar INTO the page's existing header so it
    // participates in the flex layout instead of overlapping it.
    var meta = document.querySelector(".header-meta");
    if (topbar && meta) {
      topbar.classList.add("__opco_inline");
      meta.appendChild(topbar);
    }

    if (topbar) topbar.classList.add("shown");
    // Match toolkit/projects/welders convention: "<username> · " (middle
    // dot + trailing space) so the username sits to the left of the icon
    // buttons with a visible separator.
    users.forEach(function(ul){ ul.textContent = sess.u + " · "; });
    logouts.forEach(function(lo){
      lo.addEventListener("click", function(){
        try { localStorage.removeItem(__OPCO_SESSION_KEY); } catch(e){}
        // Also clear legacy keys so the doc-portal's own session check is reset
        try {
          localStorage.removeItem("opco_portal_authenticated");
          sessionStorage.removeItem("opco_portal_authenticated");
          localStorage.removeItem("opco_portal_user");
          sessionStorage.removeItem("opco_portal_user");
          localStorage.removeItem("opco_portal_user_name");
        } catch(e){}
        location.replace("./");
      });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", reveal);
  } else {
    reveal();
  }
})();
</script>
<!-- ===== END AUTH GUARD ===== -->

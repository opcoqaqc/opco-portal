<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPCO Portal — QA/QC Manager KPIs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { background: #0d1117; color: #c9d1d9; font-size: 13px; }
  body::before { content:''; position:fixed; top:0; left:0; right:0; height:4px;
                 background:linear-gradient(90deg,#0A2540 0%,#C9A961 50%,#0A2540 100%); z-index:1001; }

  /* ------- Auth gate ------- */
  body.__gated > .shell, body.__gated > .opco-band { display: none; }
  #gate { position: fixed; inset: 0; z-index: 9999; background: #0d1117;
          display: none; align-items: center; justify-content: center;
          flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
  body.__gated #gate { display: flex; }
  #gate h1 { font-size: 18px; color: #f0e4c9; font-weight: 600; }
  #gate p  { color: #8b949e; max-width: 460px; line-height: 1.5; }
  #gate a  { color: #2DD4BF; text-decoration: none; font-weight: 600;
             padding: 8px 18px; border: 1px solid #2DD4BF; border-radius: 8px;
             margin-top: 6px; }
  #gate a:hover { background: rgba(45,212,191,0.10); }

  /* ------- Band (matches portal subpages 1:1) ------- */
  .opco-band {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 28px;
    background: #11131a;
    border-bottom: 1px solid #1d212d;
    position: sticky; top: 0; z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #e8e6e0;
  }
  .opco-band-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none; color: #b0b8c4;
    transition: background .15s, color .15s, border-color .15s, transform .15s;
    white-space: nowrap;
  }
  .opco-band-back:hover { background: rgba(255,255,255,0.09); color: #f0e4c9; border-color: rgba(255,255,255,0.18); transform: translateX(-2px); }
  .opco-band-back svg { width: 13px; height: 13px; }
  .opco-band-divider { width: 1px; height: 22px; background: rgba(255,255,255,0.1); }
  .opco-band-spacer { flex: 1; }
  .opco-band-actions { display: flex; align-items: center; gap: 4px; }
  .opco-band-iconbtn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border: 0; background: transparent; border-radius: 8px;
    color: #b0b8c4; cursor: pointer;
    transition: background .15s, color .15s;
    font-family: inherit;
  }
  .opco-band-iconbtn svg { width: 17px; height: 17px; }
  .opco-band-iconbtn:hover { background: rgba(255,255,255,0.07); color: #f0e4c9; }
  .opco-band-user {
    font-size: 11.5px; color: #6c7589; padding: 0 6px 0 4px;
    text-transform: none; letter-spacing: 0.02em;
  }
  .opco-mini-tiles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .opco-mini-tile {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em;
    color: #8b95a7;
    text-decoration: none;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .opco-mini-tile:hover { background: rgba(255,255,255,0.06); color: #f0e4c9; border-color: rgba(255,255,255,0.12); }
  .opco-mini-tile-icon { width: 14px; height: 14px; color: var(--accent); display: inline-flex; }
  .opco-mini-tile-icon svg { width: 100%; height: 100%; }
  .opco-mini-tile.active {
    background: color-mix(in oklch, var(--accent) 14%, transparent);
    color: var(--accent);
    border-color: color-mix(in oklch, var(--accent) 35%, transparent);
  }
  .opco-mini-tile.active .opco-mini-tile-icon { color: var(--accent); }
  @media (max-width: 900px) {
    .opco-mini-tile-text { display: none; }
    .opco-mini-tile { padding: 7px 9px; }
  }
  @media (max-width: 700px) {
    .opco-band { padding: 10px 14px; gap: 10px; }
    .opco-band-back { padding: 6px 10px; font-size: 11px; }
    .opco-band-divider { display: none; }
  }

  /* ------- Shell ------- */
  .shell { display: flex; min-height: calc(100vh - 58px); }

  /* ------- Sidebar (matches Calculators 1:1) ------- */
  .sidebar { width: 280px; flex-shrink: 0; background: #161b22;
             border-right: 1px solid #30363d; padding: 12px 0 16px;
             display: flex; flex-direction: column; align-self: stretch; }
  .side-title { padding: 8px 18px 6px; font-size: 10.5px; letter-spacing: 1.2px;
                color: #C9A961; font-weight: 700; text-transform: uppercase; opacity: 0.85; }
  .side-footer { margin-top: auto; padding: 16px 22px 4px;
                 border-top: 1px solid rgba(255,255,255,0.05);
                 font-size: 10.5px; line-height: 1.55; color: #8b949e; }
  .side-footer .lbl { display: block; margin-bottom: 4px;
                       font-size: 9.5px; letter-spacing: 0.12em;
                       text-transform: uppercase; font-weight: 700;
                       color: #C9A961; }
  .side-footer .txt { color: #8b949e; }
  .side-item { display: flex; align-items: center; padding: 10px 12px;
               margin: 6px 14px; border: 1px solid rgba(255,255,255,0.08);
               border-radius: 10px; font-size: 13.5px; font-weight: 700; color: #c9d1d9;
               cursor: pointer; transition: background .15s, border-color .15s, color .15s;
               text-decoration: none; }
  .side-item:hover { background: rgba(201,169,97,0.05); color: #C9A961; }
  .side-item.active { background: rgba(201,169,97,0.08);
                      border-color: rgba(201,169,97,0.45); color: #C9A961; }
  .side-icon { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
               display: inline-flex; align-items: center; justify-content: center;
               color: #ffffff; margin-right: 10px; }
  .side-icon svg { width: 13px; height: 13px; fill: none; stroke: currentColor;
                   stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ------- Content ------- */
  .content { flex: 1; padding: 32px 40px 48px; min-width: 0; max-width: 1400px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.3em; color: #2DD4BF;
             font-weight: 700; text-transform: uppercase; }
  h1.page-h { font-size: 26px; color: #f0e4c9; margin: 8px 0 6px; font-weight: 700; }
  .lead { color: #8b949e; margin: 0 0 22px; font-size: 13px; line-height: 1.5; }

  .view { display: none; }
  .view.active { display: block; }

  /* ------- Cards (shared) ------- */
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
          padding: 20px 24px; margin-bottom: 14px; }
  .card-h { font-size: 11px; letter-spacing: 0.18em; color: #C49A55;
            font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .card-body { line-height: 1.6; color: #cfd6df; }
  .card-body p { margin-bottom: 8px; }

  /* ------- Cover view ------- */
  .meta-grid { display: grid; grid-template-columns: 200px 1fr; gap: 10px 18px;
               font-size: 13px; }
  .meta-grid .lbl { color: #8b949e; font-size: 11.5px; letter-spacing: 0.05em;
                    text-transform: uppercase; font-weight: 600; }
  .meta-grid .val { color: #cfd6df; }
  .framework-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .framework-item { padding: 14px 16px; background: rgba(45,212,191,0.04);
                    border: 1px solid rgba(45,212,191,0.18); border-radius: 10px; }
  .framework-item .n { font-size: 13.5px; font-weight: 700; color: #2DD4BF; margin-bottom: 6px; }
  .framework-item .d { font-size: 12px; color: #9aa3b2; line-height: 1.5; }
  .standards-note { font-size: 12px; color: #8b949e; padding: 14px 18px;
                    background: rgba(255,255,255,0.02); border-left: 3px solid #C9A961;
                    border-radius: 4px; line-height: 1.6; margin-top: 14px; }

  /* ------- KPI Definitions ------- */
  .kpi-def { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
             margin-bottom: 14px; overflow: hidden; }
  .kpi-def-h { padding: 14px 22px; background: rgba(201,169,97,0.06);
               border-bottom: 1px solid #30363d;
               display: flex; align-items: center; gap: 14px; }
  .kpi-def-id { font-size: 11px; letter-spacing: 0.2em; color: #C49A55;
                font-weight: 800; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                padding: 4px 10px; background: rgba(201,169,97,0.15); border-radius: 6px; }
  .kpi-def-name { font-size: 16px; color: #f0e4c9; font-weight: 700; }
  .kpi-def-body { padding: 18px 22px; display: grid; grid-template-columns: 1fr 1fr;
                  gap: 16px 24px; }
  .kpi-def-block { font-size: 12.5px; color: #cfd6df; line-height: 1.55; }
  .kpi-def-block .lbl { font-size: 10px; letter-spacing: 0.18em; color: #8b949e;
                        text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
  .kpi-def-block.full { grid-column: 1 / -1; }
  .kpi-def-block pre { white-space: pre-wrap; font-family: inherit; font-size: 12px;
                       color: #cfd6df; }
  .target-pill { display: inline-block; padding: 4px 10px;
                 background: rgba(45,212,191,0.12); color: #2DD4BF;
                 border-radius: 6px; font-weight: 700; font-size: 12px;
                 font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ------- Scoring Matrix ------- */
  .scoring-table { width: 100%; border-collapse: collapse; font-size: 12px;
                   background: #161b22; border: 1px solid #30363d; border-radius: 12px;
                   overflow: hidden; table-layout: fixed; }
  .scoring-table col.kpi-id-col { width: 8%; }
  .scoring-table col.kpi-name-col { width: 24%; }
  .scoring-table col.weight-col { width: 8%; }
  .scoring-table col.band-col { width: 12%; }
  .scoring-table th, .scoring-table td { word-wrap: break-word; overflow-wrap: anywhere; }
  .scoring-table th, .scoring-table td { padding: 9px 12px;
                                          border-bottom: 1px solid rgba(255,255,255,0.05);
                                          text-align: left; }
  .scoring-table th { background: rgba(255,255,255,0.03); font-size: 10px;
                      letter-spacing: 0.12em; text-transform: uppercase; color: #8b949e;
                      font-weight: 700; }
  .scoring-table .kpi-cell { color: #f0e4c9; font-weight: 600; }
  .scoring-table .weight-cell { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; color: #C9A961; }
  .scoring-table .band-cell { font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
                              font-size: 11.5px; text-align: center; }
  .scoring-table .band-1 { background: rgba(228,116,128,0.08); color: #E47480; }
  .scoring-table .band-2 { background: rgba(239,159,39,0.08);  color: #EF9F27; }
  .scoring-table .band-3 { background: rgba(201,169,97,0.08); color: #C9A961; }
  .scoring-table .band-4 { background: rgba(93,163,224,0.08); color: #5DA3E0; }
  .scoring-table .band-5 { background: rgba(93,202,165,0.10); color: #5DCAA5; }
  .scoring-table tbody tr:last-child td { border-bottom: 0; }
  .composite-rating { display: grid; grid-template-columns: 130px 160px 1fr; gap: 12px 22px;
                      padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
                      font-size: 12.5px; }
  .composite-rating:last-child { border-bottom: 0; }
  .composite-rating .r { font-family: ui-monospace,SFMono-Regular,Menlo,monospace;
                          color: #C9A961; font-weight: 700; }
  .composite-rating .rating-pill { display: inline-block; padding: 3px 10px;
                                   border-radius: 8px; font-size: 11px; font-weight: 700;
                                   letter-spacing: 0.05em; }
  .composite-rating .interp { color: #9aa3b2; font-size: 12px; line-height: 1.5; }

  .rating-Outstanding   { background: rgba(93,202,165,0.18); color: #5DCAA5; }
  .rating-Exceeds       { background: rgba(93,163,224,0.18); color: #5DA3E0; }
  .rating-Meets         { background: rgba(201,169,97,0.18); color: #C9A961; }
  .rating-Below         { background: rgba(239,159,39,0.18); color: #EF9F27; }
  .rating-Unsatisfactory{ background: rgba(228,116,128,0.18); color: #E47480; }

  /* ------- Monthly Tracker ------- */
  .composite-hero {
    background: linear-gradient(135deg, rgba(45,212,191,0.12), rgba(45,212,191,0.04));
    border: 1px solid rgba(45,212,191,0.30); border-radius: 14px;
    padding: 24px 28px; margin-bottom: 20px;
    display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center;
  }
  .composite-hero-h { font-size: 11px; letter-spacing: 0.18em; color: #2DD4BF;
                      font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
  .composite-hero-val { font-size: 54px; font-weight: 700; color: #f0e4c9;
                         line-height: 1; letter-spacing: -0.02em; }
  .composite-hero-rating { display: inline-block; padding: 6px 14px; border-radius: 999px;
                            font-weight: 700; font-size: 12px; letter-spacing: 0.06em;
                            text-transform: uppercase; margin-top: 8px; }
  .composite-hero-breakdown { display: flex; gap: 24px; flex-wrap: wrap; }
  .composite-hero-breakdown div { font-size: 11px; color: #8b949e; letter-spacing: 0.08em; }
  .composite-hero-breakdown b { display: block; font-size: 16px; color: #f0e4c9;
                                 margin-top: 4px; font-weight: 700; }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
              margin-bottom: 20px; }
  .kpi-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
              padding: 18px 20px; display: flex; flex-direction: column; }
  .kpi-card .id { font-size: 10.5px; letter-spacing: 0.18em; font-weight: 700;
                  text-transform: uppercase; }
  .kpi-card h3 { font-size: 14px; color: #f0e4c9; margin: 4px 0 12px;
                  font-weight: 600; line-height: 1.3; min-height: 36px; }
  .kpi-card .vals { display: flex; gap: 18px; align-items: baseline; margin-bottom: 4px; }
  .kpi-card .curr { font-size: 24px; font-weight: 700; color: #f0e4c9; }
  .kpi-card .curr-lbl, .kpi-card .ytd-lbl {
    font-size: 10px; color: #8b949e; letter-spacing: 0.12em; text-transform: uppercase; }
  .kpi-card .ytd { font-size: 14px; color: #cfd6df; }
  .kpi-card .target { font-size: 11px; color: #8b949e; margin-top: 4px; }
  .kpi-card .spark { margin: 12px 0 8px; height: 38px; }
  .kpi-card .foot { display: flex; align-items: center; justify-content: space-between;
                     font-size: 11px; margin-top: auto; }
  .kpi-card .score-badge { padding: 3px 10px; border-radius: 8px; font-weight: 700;
                            font-size: 11px; }
  .kpi-card.no-data { opacity: 0.7; }
  .kpi-card.no-data h3 { color: #9aa3b2; }
  .kpi-card .no-data-note { font-size: 11.5px; color: #8b949e; margin-top: 6px;
                             line-height: 1.5; }

  .score-1 { background: rgba(228,116,128,0.15); color: #E47480; }
  .score-2 { background: rgba(239,159,39,0.15);  color: #EF9F27; }
  .score-3 { background: rgba(201,169,97,0.15);  color: #C9A961; }
  .score-4 { background: rgba(93,163,224,0.15);  color: #5DA3E0; }
  .score-5 { background: rgba(93,202,165,0.18);  color: #5DCAA5; }
  .score-na { background: rgba(108,117,137,0.18); color: #9aa3b2; }

  .contrib-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .contrib-table th { text-align: left; padding: 8px 12px; font-size: 10.5px;
                       letter-spacing: 0.1em; text-transform: uppercase; color: #8b949e;
                       border-bottom: 1px solid #30363d; font-weight: 700; }
  .contrib-table td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .contrib-table tbody tr.total td { border-bottom: 0; font-weight: 700;
                                       color: #f0e4c9; background: rgba(45,212,191,0.04); }
  .contrib-table .num { text-align: right;
                         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ------- Data Sources ------- */
  .ds-table { width: 100%; border-collapse: collapse; font-size: 12px;
              background: #161b22; border: 1px solid #30363d; border-radius: 12px;
              overflow: hidden; margin-bottom: 14px; }
  .ds-table th, .ds-table td { padding: 10px 12px; text-align: left;
                                 border-bottom: 1px solid rgba(255,255,255,0.05);
                                 vertical-align: top; }
  .ds-table th { background: rgba(255,255,255,0.03); font-size: 10px;
                  letter-spacing: 0.12em; text-transform: uppercase; color: #8b949e;
                  font-weight: 700; }
  .ds-table .id-cell { color: #C9A961; font-weight: 700; white-space: nowrap;
                        font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
  .ds-table .kpi-cell { color: #f0e4c9; font-weight: 600; }
  .ds-table tbody tr:last-child td { border-bottom: 0; }
  .gov-grid { display: grid; grid-template-columns: 140px 1fr; gap: 12px 22px;
              font-size: 12.5px; line-height: 1.55; }
  .gov-grid .lbl { color: #C9A961; font-weight: 700; }
  .gov-grid .txt { color: #cfd6df; }
</style>
<script src="_tracking.js"></script>
</head>

</div>

<!-- Top band -->
<div class="opco-band" id="opco-page-band" style="--page-accent: #2DD4BF;">

    <a href="projects.html" class="opco-mini-tile" data-key="dashboard" style="--accent:#5DCAA5; view-transition-name: card-dashboard;"><span class="opco-mini-tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span><span class="opco-mini-tile-text">Dashboard</span></a>

    var html = '<div class="eyebrow">QA/QC department</div>';
    html += '<h1 class="page-h">Scoring Matrix</h1>';
    html += '<p class="lead">Each KPI scored 1 (Unsatisfactory) to 5 (Outstanding). Weighted composite drives the overall performance rating.</p>';

    html += '<div class="card" style="padding:0; overflow:hidden;">';
    html += '<div style="padding:14px 20px; background:rgba(255,255,255,0.02); border-bottom:1px solid #30363d;"><div class="card-h">Score bands &middot; per KPI</div></div>';
    html += '<table class="scoring-table" style="border:0; border-radius:0;">';
    html += '<colgroup>' +
              '<col class="kpi-id-col"><col class="kpi-name-col"><col class="weight-col">' +
              '<col class="band-col"><col class="band-col"><col class="band-col"><col class="band-col"><col class="band-col">' +
            '</colgroup>';
    html += '<thead><tr><th>KPI</th><th>KPI Name</th><th>Weight</th>';
    html += '<th class="band-cell">1 · Unsatisfactory</th><th class="band-cell">2 · Below</th>';
    html += '<th class="band-cell">3 · Meets</th><th class="band-cell">4 · Exceeds</th>';
    html += '<th class="band-cell">5 · Outstanding</th></tr></thead><tbody>';
    s.kpis.forEach(function (k) {
      html += '<tr>';
      html += '<td class="kpi-cell">' + esc(k.id) + '</td>';
      html += '<td>' + esc(k.name) + '</td>';
      html += '<td class="weight-cell">' + (k.weight == null ? '—' : k.weight) + '</td>';
      for (var i = 0; i < 5; i++) {
        html += '<td class="band-cell band-' + (i+1) + '">' + esc(k.bands[i] || '') + '</td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    html += '<div class="card">';
    html += '<div class="card-h">Composite Performance Rating</div>';
    html += '<div class="card-sub">Σ (weight × score) — final rating drives management review actions.</div>';
    s.composite.forEach(function (c) {
      var rating = (c.rating || '').split(' ')[0];
      html += '<div class="composite-rating">';
      html += '<div class="r">' + esc(c.range) + '</div>';
      html += '<div><span class="rating-pill rating-' + esc(rating) + '">' + esc(c.rating) + '</span></div>';
      html += '<div class="interp">' + esc(c.interpretation) + '</div>';
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('view-scoring').innerHTML = html;
  }

  // === Monthly Tracker view ===
  function renderTracker() {
    var t = DATA.monthly_tracker;
    var html = '<div class="eyebrow">QA/QC department &middot; ' + t.year + '</div>';
    html += '<h1 class="page-h">Monthly Tracker</h1>';
    html += '<p class="lead">Weighted composite score across 5 KPIs. Targets per ISO 9001 / ASME standards.</p>';

    // Hero
    var rating = (t.rating || '').split(' ')[0];
    var bestKpiList = [];
    t.composite_rows.forEach(function (r) {
      if (r.score === 5) bestKpiList.push(r.kpi.split('·').pop().trim().split(' (')[0]);
    });
    var bestKpi = bestKpiList.slice(0,2).join(' + ') || '—';
    var scored = t.composite_rows.filter(function (r) { return r.score != null; }).length;
    var monthsScored = 0;
    t.metrics.forEach(function (m) {
      if (m.role === 'metric' && (m.label||'').indexOf('Piping Welds Inspected') === 0) {
        m.months.forEach(function (v, i) { if (v != null && v !== 0) monthsScored = Math.max(monthsScored, i+1); });
      }
    });

    html += '<div class="composite-hero">';
    html += '<div>';
    html += '<div class="composite-hero-h">Composite YTD</div>';
    html += '<div class="composite-hero-val">' + num(t.composite_score, 2) + '</div>';
    if (t.rating) html += '<span class="composite-hero-rating rating-' + esc(rating) + '">' + esc(t.rating) + '</span>';
    html += '</div>';
    html += '<div class="composite-hero-breakdown">';
    html += '<div>SCORED<b>' + scored + ' / ' + t.composite_rows.length + '</b></div>';
    html += '<div>YTD MONTHS<b>' + monthsScored + '</b></div>';
    html += '<div>BEST KPIs<b>' + esc(bestKpi) + '</b></div>';
    html += '</div>';
    html += '</div>';

    // KPI cards — build from the composite_rows + metrics
    // Find the "→" row for each KPI to pull the headline value
    function findResultRow(kpiId) {
      var matchers = {
        'KPI-1A': '→ Pipeline Repair Rate',
        'KPI-1B': '→ Piping Repair Rate',
        'KPI-2':  '→ Throughput Compliance',
        'KPI-3':  '→ NCR Performance Score',
        'KPI-4':  '→ Audit Performance Score',
        'KPI-5':  '→ Turnaround Performance Score',
      };
      var label = matchers[kpiId];
      if (!label) return null;
      for (var i = 0; i < t.metrics.length; i++) {
        if (t.metrics[i].label && t.metrics[i].label.indexOf(label) === 0) return t.metrics[i];
      }
      return null;
    }
    function lastNonNullIdx(arr) {
      for (var i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i;
      return -1;
    }
    function fmtVal(v, unit) {
      if (v == null) return '—';
      if (unit === '%') return (v * 100).toFixed(1) + '%';
      if (unit === 'days') return Math.round(v) + ' d';
      if (unit === '1-5')  return Number(v).toFixed(1);
      return String(v);
    }
    function sparkSvg(series, color) {
      var nonNull = series.filter(function (v) { return v != null; });
      if (!nonNull.length) return '';
      var maxv = Math.max.apply(null, nonNull);
      var minv = Math.min.apply(null, nonNull);
      if (maxv === minv) { maxv = maxv + 1; minv = minv - 1; }
      var W = 200, H = 38, P = 4;
      var idxs = [];
      var pts = [];
      series.forEach(function (v, i) {
        if (v == null) return;
        var x = P + (W - 2*P) * i / Math.max(series.length - 1, 1);
        var y = H - P - (H - 2*P) * (v - minv) / (maxv - minv);
        idxs.push(i);
        pts.push(x.toFixed(1) + ',' + y.toFixed(1));
      });
      var poly = pts.join(' ');
      var last = pts[pts.length - 1].split(',');
      return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%; height:38px;">' +
        '<polyline points="' + poly + '" fill="none" stroke="' + color + '" stroke-width="1.8"/>' +
        '<polyline points="' + poly + ' ' + (W-P) + ',' + (H-P) + ' ' + P + ',' + (H-P) +
          '" fill="' + color + '22"/>' +
        '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.8" fill="' + color +
        '" stroke="#161b22" stroke-width="1.2"/>' +
        '</svg>';
    }

    var KPI_COLORS = {
      'KPI-1A': '#5DA3E0', 'KPI-1B': '#5DA3E0',
      'KPI-2':  '#5DCAA5', 'KPI-3':  '#C9A961',
      'KPI-4':  '#A77CCB', 'KPI-5':  '#EF9F27',
    };

    html += '<div class="kpi-grid">';
    DATA.kpi_definitions.forEach(function (def) {
      // Pipeline 1A and Piping 1B both come from KPI-1
      var subs = (def.id === 'KPI-1') ? ['KPI-1A', 'KPI-1B'] : [def.id];
      subs.forEach(function (subId) {
        var resRow = findResultRow(subId);
        var color  = KPI_COLORS[subId] || '#2DD4BF';
        var hasData = resRow && resRow.months && resRow.months.some(function (v) { return v != null; });
        var subName = subId === 'KPI-1A' ? 'Weld Repair Rate — Pipeline'
                    : subId === 'KPI-1B' ? 'Weld Repair Rate — Piping'
                    : def.name;
        if (!hasData) {
          html += '<div class="kpi-card no-data">';
          html += '<div class="id" style="color:' + color + ';">' + esc(subId) + '</div>';
          html += '<h3>' + esc(subName) + '</h3>';
          html += '<div class="no-data-note">No data this year — sub-scope not yet active.</div>';
          html += '<div class="foot"><div class="target">Target: ' + esc(resRow ? resRow.target : '—') + '</div>';
          html += '<span class="score-badge score-na">no data</span></div>';
          html += '</div>';
          return;
        }
        var lastIdx  = lastNonNullIdx(resRow.months);
        var lastVal  = lastIdx >= 0 ? resRow.months[lastIdx] : null;
        var lastMon  = lastIdx >= 0 ? t.months[lastIdx] : '';
        var ytdLabel = (resRow.unit === '%' || resRow.unit === 'days' || resRow.unit === '1-5') ? 'YTD' : 'YTD';
        var score    = resRow.score;
        var scoreClass = score == null ? 'score-na' : 'score-' + Math.round(score);
        var scoreText  = score == null ? '—' : 'score ' + score + ' / 5';

        html += '<div class="kpi-card">';
        html += '<div class="id" style="color:' + color + ';">' + esc(subId) + '</div>';
        html += '<h3>' + esc(subName) + '</h3>';
        html += '<div class="vals">';
        html += '<div><div class="curr-lbl">' + esc(lastMon) + '</div><div class="curr">' + fmtVal(lastVal, resRow.unit) + '</div></div>';
        html += '<div><div class="ytd-lbl">YTD</div><div class="ytd">' + fmtVal(resRow.ytd, resRow.unit) + '</div></div>';
        html += '</div>';
        html += '<div class="spark">' + sparkSvg(resRow.months, color) + '</div>';
        html += '<div class="foot">';
        html += '<div class="target">Target: ' + esc(resRow.target || '—') + '</div>';
        html += '<span class="score-badge ' + scoreClass + '">' + scoreText + '</span>';
        html += '</div>';
        html += '</div>';
      });
    });
    html += '</div>';

    // Contribution table
    html += '<div class="card">';
    html += '<div class="card-h">Composite score &middot; weighted contribution (YTD)</div>';
    html += '<table class="contrib-table"><thead><tr>';
    html += '<th>KPI</th><th class="num">Weight</th><th class="num">YTD Score (1-5)</th><th class="num">Weighted contribution</th>';
    html += '</tr></thead><tbody>';
    var totalWeight = 0, totalWeighted = 0;
    t.composite_rows.forEach(function (r) {
      var w = (r.weight != null) ? r.weight : 0;
      var s = (r.score != null) ? r.score.toFixed(1) : 'N/A';
      var wt = (r.weighted != null) ? r.weighted.toFixed(3) : '0.000';
      totalWeight += (r.weight != null ? r.weight : 0);
      totalWeighted += (r.weighted != null ? r.weighted : 0);
      html += '<tr><td>' + esc(r.kpi) + '</td>';
      html += '<td class="num">' + (r.weight != null ? r.weight.toFixed(3) : '—') + '</td>';
      html += '<td class="num">' + s + '</td>';
      html += '<td class="num">' + wt + '</td></tr>';
    });
    html += '<tr class="total"><td>COMPOSITE SCORE</td>';
    html += '<td class="num">' + (totalWeight ? totalWeight.toFixed(3) : '—') + '</td>';
    html += '<td class="num">—</td>';
    html += '<td class="num">' + totalWeighted.toFixed(3) + '</td></tr>';
    html += '</tbody></table></div>';

    document.getElementById('view-tracker').innerHTML = html;
  }

  // === Data Sources view ===
  function renderSources() {
    var d = DATA.data_sources;
    var html = '<div class="eyebrow">QA/QC department</div>';
    html += '<h1 class="page-h">Data Sources &amp; Governance</h1>';
    html += '<p class="lead">Where each KPI&apos;s numbers come from, who owns the data, and how long evidence is retained.</p>';

    html += '<div class="card" style="padding:0; overflow:hidden;">';
    html += '<div style="padding:14px 20px; background:rgba(255,255,255,0.02); border-bottom:1px solid #30363d;"><div class="card-h">Source mapping</div></div>';
    html += '<table class="ds-table" style="border:0; border-radius:0; margin:0;">';
    html += '<thead><tr><th>KPI</th><th>KPI Name</th><th>Primary Source</th><th>System / Document</th><th>Owner</th><th>Frequency</th><th>Retention</th></tr></thead><tbody>';
    d.rows.forEach(function (r) {
      html += '<tr>';
      html += '<td class="id-cell">' + esc(r.id) + '</td>';
      html += '<td class="kpi-cell">' + esc(r.kpi) + '</td>';
      html += '<td>' + esc(r.source) + '</td>';
      html += '<td>' + esc(r.system) + '</td>';
      html += '<td>' + esc(r.owner) + '</td>';
      html += '<td>' + esc(r.frequency) + '</td>';
      html += '<td>' + esc(r.retention) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';

    html += '<div class="card">';
    html += '<div class="card-h">Governance &amp; Control Principles</div>';
    html += '<div class="gov-grid">';
    d.governance.forEach(function (g) {
      html += '<div class="lbl">' + esc(g.label) + '</div><div class="txt">' + esc(g.text) + '</div>';
    });
    html += '</div></div>';
    document.getElementById('view-sources').innerHTML = html;
  }

  renderDefinitions(); renderScoring(); renderTracker(); renderSources();

  // Sidebar footer — standards alignment line from cover data
  (function () {
    var footEl = document.getElementById('side-footer');
    var std = DATA.cover && DATA.cover.standards;
    if (footEl && std) {
      footEl.innerHTML = '<span class="lbl">Aligned with</span>' +
                         '<span class="txt">' + esc(std) + '</span>';
    }
  })();

  // === Tab switching ===
  function activate(tab) {
    document.querySelectorAll('.side-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    document.querySelectorAll('.view').forEach(function (el) {
      el.classList.toggle('active', el.id === 'view-' + tab);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
    if (window.opcoTrack) try { window.opcoTrack('tab', 'qaqc:' + tab); } catch(e) {}
  }
  document.querySelectorAll('.side-item').forEach(function (el) {
    el.addEventListener('click', function (e) {
      e.preventDefault();
      activate(el.getAttribute('data-tab'));
    });
  });
  // Read hash for deep linking
  var initial = (location.hash || '').replace('#', '');
  if (initial && document.getElementById('view-' + initial)) activate(initial);
})();
</script>
</body>
</html>

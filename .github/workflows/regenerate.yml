name: Regenerate Portal from Drive

# Her 15 dakikada bir Google Drive'i tara, documents.html'i yeniden uret,
# Netlify'a deploy et (full site).
# Repo'da static/ klasoru icindeki index.html ve toolkit.html korunur.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # static/ klasorunde dosya degisirse de tetikle (manuel update)
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/**'
      - '.github/workflows/regenerate.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-portal
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Collect Drive links
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          DRIVE_ROOT_FOLDER_NAME: 'OPCO Portal Documents'
          OUTPUT_CSV: drive_links.csv
        run: |
          python scripts/collect_drive_links.py

      - name: Regenerate index.html (Drive-driven)
        env:
          HTML_FILE: index.html
          CSV_FILE: drive_links.csv
        run: |
          python scripts/generate_html.py

      - name: Install javascript-obfuscator (Node)
        run: |
          npm install -g javascript-obfuscator

      - name: Inject auth guard + favicon -> documents.html
        env:
          INPUT_HTML: index.html
          OUTPUT_HTML: documents.html
          AUTH_GUARD_FILE: scripts/auth_guard.html
          FAVICON_FILE: scripts/favicon.txt
        run: |
          # Make globally-installed javascript-obfuscator available to Node subprocess
          export NODE_PATH=$(npm root -g)
          python scripts/inject_auth.py

      - name: Regenerate toolkit subpages
        run: |
          python scripts/build_subpages.py

      - name: Assemble deploy package
        run: |
          set -e
          mkdir -p deploy_pkg
          # Static files (managed manually in repo)
          cp -v static/index.html        deploy_pkg/index.html
          cp -v static/toolkit.html      deploy_pkg/toolkit.html
          cp -v static/toolkit.bundle.js deploy_pkg/toolkit.bundle.js
          cp -v static/projects.html     deploy_pkg/projects.html
          cp -v static/welders.html      deploy_pkg/welders.html
          # Auto-generated file from Drive
          cp -v documents.html           deploy_pkg/documents.html
          # Custom domain for GitHub Pages
          echo "opcoportal.com" > deploy_pkg/CNAME
          echo "--- Deploy package ---"
          ls -la deploy_pkg/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy_pkg
          publish_branch: gh-pages
          user_name: opco-portal-bot
          user_email: opco-portal-bot@users.noreply.github.com
          commit_message: "auto: deploy portal from ${{ github.sha }}"
          cname: opcoportal.com

      - name: Commit regenerated index.html (backup)
        # GitHub Pages icin de guncel tut. Istemezsen sil.
        run: |
          set -e
          git config user.name  "opco-portal-bot"
          git config user.email "opco-portal-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html — skipping commit."
            exit 0
          fi
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          git commit -m "auto: regenerate portal ($TIMESTAMP)"
          git push
